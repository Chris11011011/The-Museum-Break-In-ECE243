<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430">
  <style>
    .title { font:700 34px Arial,sans-serif; fill:#0f172a; }
    .sub { font:400 17px Arial,sans-serif; fill:#475569; }
    .stepTitle { font:700 17px Arial,sans-serif; fill:#0f172a; }
    .body { font:400 14px Arial,sans-serif; fill:#475569; }
    .num { font:700 19px Arial,sans-serif; fill:#ffffff; }
  </style>
  <rect width="1200" height="430" fill="#f8fafc"/>
  <text x="55" y="58" class="title">How the Project Evolved</text>
  <text x="55" y="88" class="sub">The final system grew from a simple laser-maze idea into a hardware-heavy integration project.</text>

  <line x1="115" y1="176" x2="1085" y2="176" stroke="#cbd5e1" stroke-width="8" stroke-linecap="round"/>

  <circle cx="120" cy="176" r="30" fill="#6366f1"/>
  <text x="120" y="183" text-anchor="middle" class="num">1</text>
  <text x="120" y="236" text-anchor="middle" class="stepTitle">Concept</text>
  <text x="120" y="265" text-anchor="middle" class="body">Laser maze + 2D</text>
  <text x="120" y="285" text-anchor="middle" class="body">player movement</text>
  <text x="120" y="318" text-anchor="middle" class="body">Early checkpoint:</text>
  <text x="120" y="338" text-anchor="middle" class="body">ultrasonic + manual</text>

  <circle cx="360" cy="176" r="30" fill="#3b82f6"/>
  <text x="360" y="183" text-anchor="middle" class="num">2</text>
  <text x="360" y="236" text-anchor="middle" class="stepTitle">Subsystem Tests</text>
  <text x="360" y="265" text-anchor="middle" class="body">Motors, sensors,</text>
  <text x="360" y="285" text-anchor="middle" class="body">lasers, GPIO</text>
  <text x="360" y="318" text-anchor="middle" class="body">Tested separately</text>
  <text x="360" y="338" text-anchor="middle" class="body">before integration</text>

  <circle cx="600" cy="176" r="30" fill="#0ea5e9"/>
  <text x="600" y="183" text-anchor="middle" class="num">3</text>
  <text x="600" y="236" text-anchor="middle" class="stepTitle">Mechanical Build</text>
  <text x="600" y="265" text-anchor="middle" class="body">SketchUp course layout</text>
  <text x="600" y="285" text-anchor="middle" class="body">+ 3D-printed conveyor</text>
  <text x="600" y="318" text-anchor="middle" class="body">Two independent</text>
  <text x="600" y="338" text-anchor="middle" class="body">motorized axes</text>

  <circle cx="840" cy="176" r="30" fill="#10b981"/>
  <text x="840" y="183" text-anchor="middle" class="num">4</text>
  <text x="840" y="236" text-anchor="middle" class="stepTitle">System Integration</text>
  <text x="840" y="265" text-anchor="middle" class="body">Arduino ADC + sensors</text>
  <text x="840" y="285" text-anchor="middle" class="body">L298N + PWM + VGA</text>
  <text x="840" y="318" text-anchor="middle" class="body">Interrupt-driven</text>
  <text x="840" y="338" text-anchor="middle" class="body">real-time behaviour</text>

  <circle cx="1080" cy="176" r="30" fill="#059669"/>
  <text x="1080" y="183" text-anchor="middle" class="num">5</text>
  <text x="1080" y="236" text-anchor="middle" class="stepTitle">Final Demo</text>
  <text x="1080" y="265" text-anchor="middle" class="body">IR checkpoint +</text>
  <text x="1080" y="285" text-anchor="middle" class="body">GPU pedestal</text>
  <text x="1080" y="318" text-anchor="middle" class="body">VGA completed;</text>
  <text x="1080" y="338" text-anchor="middle" class="body">audio deferred</text>

  <rect x="408" y="372" width="384" height="38" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="600" y="396" text-anchor="middle" class="body">Final checkpoint implementation changed from ultrasonic sensing to IR.</text>
</svg>