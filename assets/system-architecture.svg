<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 34px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 17px Arial, sans-serif; fill: #475569; }
      .label { font: 700 18px Arial, sans-serif; fill: #0f172a; }
      .small { font: 400 15px Arial, sans-serif; fill: #334155; }
      .tiny { font: 400 13px Arial, sans-serif; fill: #64748b; }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 16; }
      .input { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; rx: 14; }
      .core { fill: #eef2ff; stroke: #6366f1; stroke-width: 3; rx: 22; }
      .output { fill: #ecfdf5; stroke: #34d399; stroke-width: 2; rx: 14; }
      .support { fill: #fff7ed; stroke: #fb923c; stroke-width: 2; rx: 14; }
      .wire { stroke: #475569; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .wire2 { stroke: #64748b; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="680" fill="#f8fafc"/>
  <text x="60" y="58" class="title">Museum Break-In — System Architecture</text>
  <text x="60" y="88" class="subtitle">Physical sensors and player controls feed the DE1-SoC; game logic remains on the Nios V side.</text>

  <text x="80" y="138" class="label">Inputs &amp; sensing</text>
  <rect x="55" y="160" width="275" height="72" class="input"/>
  <text x="78" y="190" class="label">DE1-SoC Pushbuttons</text>
  <text x="78" y="214" class="small">X / Y movement commands</text>

  <rect x="55" y="260" width="275" height="72" class="input"/>
  <text x="78" y="290" class="label">Laser + Photoresistors</text>
  <text x="78" y="314" class="small">4 beam-interruption sensors</text>

  <rect x="55" y="360" width="275" height="72" class="support"/>
  <text x="78" y="390" class="label">Arduino Uno ADC</text>
  <text x="78" y="414" class="small">Analog sensor interface only</text>

  <rect x="55" y="460" width="275" height="72" class="input"/>
  <text x="78" y="490" class="label">Checkpoint IR Sensor</text>
  <text x="78" y="514" class="small">Progress / barrier trigger</text>

  <rect x="55" y="560" width="275" height="72" class="input"/>
  <text x="78" y="590" class="label">Pedestal IR Sensor</text>
  <text x="78" y="614" class="small">Final artifact pickup</text>

  <rect x="420" y="165" width="355" height="415" class="core"/>
  <text x="455" y="210" style="font:700 27px Arial,sans-serif;fill:#312e81;">DE1-SoC / Nios V</text>
  <text x="455" y="244" class="small">Central controller</text>
  <line x1="455" y1="264" x2="740" y2="264" stroke="#a5b4fc" stroke-width="2"/>
  <text x="455" y="306" class="label">Game state</text>
  <text x="455" y="335" class="small">Checkpoint • win / fail • reset</text>
  <text x="455" y="382" class="label">Interrupt handling</text>
  <text x="455" y="411" class="small">Sensors • countdown • motor PWM</text>
  <text x="455" y="458" class="label">Real-time control</text>
  <text x="455" y="487" class="small">Motor direction / enable • barrier laser</text>
  <text x="455" y="534" class="label">Visual feedback</text>
  <text x="455" y="563" class="small">VGA state and status output</text>

  <text x="870" y="138" class="label">Outputs &amp; actuation</text>
  <rect x="850" y="165" width="295" height="88" class="output"/>
  <text x="875" y="198" class="label">L298N Motor Driver</text>
  <text x="875" y="224" class="small">Direction + enable signals</text>

  <rect x="850" y="290" width="140" height="78" class="output"/>
  <text x="875" y="321" class="label">X Motor</text>
  <text x="875" y="345" class="small">Conveyor axis</text>

  <rect x="1005" y="290" width="140" height="78" class="output"/>
  <text x="1030" y="321" class="label">Y Motor</text>
  <text x="1030" y="345" class="small">Conveyor axis</text>

  <rect x="850" y="415" width="295" height="78" class="output"/>
  <text x="875" y="446" class="label">Checkpoint Laser</text>
  <text x="875" y="470" class="small">Barrier enable / disable</text>

  <rect x="850" y="540" width="295" height="78" class="output"/>
  <text x="875" y="571" class="label">VGA Display</text>
  <text x="875" y="595" class="small">Gameplay / fail / success feedback</text>

  <path d="M330 196 C370 196, 380 230, 420 230" class="wire"/>
  <path d="M330 296 C360 296, 365 396, 330 396" class="wire2"/>
  <path d="M330 396 C375 396, 385 360, 420 360" class="wire"/>
  <path d="M330 496 C375 496, 385 430, 420 430" class="wire"/>
  <path d="M330 596 C375 596, 385 500, 420 500" class="wire"/>

  <path d="M775 242 C815 242, 815 209, 850 209" class="wire"/>
  <path d="M997 253 L920 290" class="wire2"/>
  <path d="M997 253 L1075 290" class="wire2"/>
  <path d="M775 445 C815 445, 815 454, 850 454" class="wire"/>
  <path d="M775 535 C815 535, 815 579, 850 579" class="wire"/>

  <rect x="403" y="610" width="390" height="44" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" rx="12"/>
  <text x="598" y="638" text-anchor="middle" class="tiny">Arduino supports sensing; movement, timing, game logic, interrupts, and outputs stay on the DE1-SoC.</text>
</svg>