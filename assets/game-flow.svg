<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
    <marker id="redarrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#dc2626"/>
    </marker>
    <style>
      .title { font: 700 34px Arial, sans-serif; fill:#0f172a; }
      .sub { font:400 17px Arial,sans-serif; fill:#475569; }
      .node { fill:#ffffff; stroke:#94a3b8; stroke-width:2; rx:18; }
      .checkpoint { fill:#eff6ff; stroke:#3b82f6; stroke-width:2.5; rx:18; }
      .win { fill:#ecfdf5; stroke:#10b981; stroke-width:2.5; rx:18; }
      .fail { fill:#fef2f2; stroke:#ef4444; stroke-width:2.5; rx:18; }
      .label { font:700 18px Arial,sans-serif; fill:#0f172a; }
      .small { font:400 14px Arial,sans-serif; fill:#475569; }
      .line { stroke:#475569; stroke-width:2.4; fill:none; marker-end:url(#arrow); }
      .failLine { stroke:#dc2626; stroke-width:2.2; fill:none; marker-end:url(#redarrow); }
      .failText { font:600 13px Arial,sans-serif; fill:#b91c1c; }
    </style>
  </defs>

  <rect width="1200" height="470" fill="#f8fafc"/>
  <text x="55" y="58" class="title">Gameplay Progression</text>
  <text x="55" y="88" class="sub">A successful run is a sequence of physical events, with failure possible at any timed security stage.</text>

  <rect x="55" y="145" width="155" height="85" class="node"/>
  <text x="132.5" y="180" text-anchor="middle" class="label">Start / Reset</text>
  <text x="132.5" y="204" text-anchor="middle" class="small">Timer begins</text>

  <rect x="255" y="145" width="185" height="85" class="node"/>
  <text x="347.5" y="180" text-anchor="middle" class="label">Navigate Lasers</text>
  <text x="347.5" y="204" text-anchor="middle" class="small">Move on X / Y axes</text>

  <rect x="485" y="145" width="185" height="85" class="checkpoint"/>
  <text x="577.5" y="180" text-anchor="middle" class="label">Checkpoint IR</text>
  <text x="577.5" y="204" text-anchor="middle" class="small">Progress detected</text>

  <rect x="715" y="145" width="185" height="85" class="checkpoint"/>
  <text x="807.5" y="180" text-anchor="middle" class="label">Barrier Disabled</text>
  <text x="807.5" y="204" text-anchor="middle" class="small">Final region opens</text>

  <rect x="945" y="145" width="185" height="85" class="win"/>
  <text x="1037.5" y="180" text-anchor="middle" class="label">GPU Pedestal</text>
  <text x="1037.5" y="204" text-anchor="middle" class="small">Artifact IR → win</text>

  <path d="M210 187.5 L255 187.5" class="line"/>
  <path d="M440 187.5 L485 187.5" class="line"/>
  <path d="M670 187.5 L715 187.5" class="line"/>
  <path d="M900 187.5 L945 187.5" class="line"/>

  <rect x="415" y="330" width="370" height="88" class="fail"/>
  <text x="600" y="366" text-anchor="middle" class="label">Game Over</text>
  <text x="600" y="392" text-anchor="middle" class="small">Beam interrupted or countdown reaches zero</text>

  <path d="M347 230 C347 285, 470 290, 525 330" class="failLine"/>
  <text x="330" y="286" class="failText">beam break / timeout</text>

  <path d="M807 230 C807 285, 710 295, 670 330" class="failLine"/>
  <text x="785" y="286" class="failText">beam break / timeout</text>

  <path d="M600 418 C600 446, 132 446, 132 230" class="line"/>
  <text x="320" y="452" class="small">reset</text>
</svg>